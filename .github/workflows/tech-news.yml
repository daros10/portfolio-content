name: Update tech news

on:
  schedule:
    # 05:00 Ecuador (UTC-5)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Fetch tech news
        # El script ya no falla el proceso por errores de feeds individuales o por no alcanzar el
        # mínimo de items (conserva el tech-news.json anterior en ese caso). continue-on-error queda
        # como red de seguridad extra para que un fallo inesperado (p. ej. en npm install o en el
        # propio script) tampoco tumbe el workflow diario.
        run: npm run fetch:tech-news
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- content/tech-news.json; then
            echo "Sin cambios en tech-news.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/tech-news.json
          git commit -m "chore: update tech news feed"
          git push
